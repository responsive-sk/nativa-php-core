{
  "schema_version": "0.2.16",
  "definitions": [
    {
      "id": "comments.comment_created",
      "kind": "event",
      "version": 1,
      "description": "A comment was submitted and stored with status pending",
      "payload": [
        {
          "name": "comment_id",
          "type": {
            "ref": "users.identifier"
          },
          "required": true
        },
        {
          "name": "article_slug",
          "type": {
            "ref": "blog.slug"
          },
          "required": true
        },
        {
          "name": "status",
          "type": {
            "ref": "comments.status"
          },
          "required": true
        }
      ]
    },
    {
      "id": "comments.comment_status_changed",
      "kind": "event",
      "version": 1,
      "description": "A comment's moderation status changed (approved or rejected)",
      "payload": [
        {
          "name": "comment_id",
          "type": {
            "ref": "users.identifier"
          },
          "required": true
        },
        {
          "name": "status",
          "type": {
            "ref": "comments.status"
          },
          "required": true
        }
      ]
    },
    {
      "id": "comments.comment_deleted",
      "kind": "event",
      "version": 1,
      "description": "A comment row was removed permanently",
      "payload": [
        {
          "name": "comment_id",
          "type": {
            "ref": "users.identifier"
          },
          "required": true
        }
      ]
    },
    {
      "id": "comments.comment_submit_denied",
      "kind": "event",
      "version": 1,
      "description": "A submit was denied by a submit policy (throttle, identity, or unknown article)",
      "payload": [
        {
          "name": "article_slug",
          "type": {
            "ref": "blog.slug"
          },
          "required": true
        },
        {
          "name": "reason",
          "type": {
            "ref": "comments.display_name"
          },
          "required": true
        }
      ]
    }
  ]
}
