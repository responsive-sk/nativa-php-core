name: Publish the theme gallery

# `evan70/nativa-themes` is generated from this tree by
# `bin/build/publish-themes.sh`. This workflow runs it on every master change
# that can move the gallery: a theme module, its frontend build source, the
# gallery itself, or the renderer/publisher that produces it.
#
# The push needs a token with write access to the published repository, stored
# as the `THEMES_PUSH_TOKEN` secret. Without it the checks still run and the
# publish step is skipped with a notice, so a fork does not fail.

on:
  push:
    branches: [master]
    paths:
      - 'modules/Themes/**'
      - 'Frontend/packages/**'
      - 'themes/gallery/**'
      - 'bin/build/render-theme-pages.php'
      - 'bin/build/publish-themes.sh'
      - '.github/workflows/themes-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: themes-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Secrets are not available in a step-level `if`, so the token is read
      # into the job environment and the steps test that value instead.
      THEMES_PUSH_TOKEN: ${{ secrets.THEMES_PUSH_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer

      - name: Install dev tooling
        run: composer install --no-interaction --no-progress

      - name: Install the catalogue (the renderer loads the theme modules)
        run: make modules-install

      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 12

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: themes/gallery/pnpm-lock.yaml

      - name: Install the gallery
        working-directory: themes/gallery
        run: pnpm install --frozen-lockfile

      # The sources are in this project now, so this gate runs rather than
      # reporting the old "private repository, skipped" result.
      - name: The gallery's src/ matches the kernel
        working-directory: themes/gallery
        run: pnpm run sync:check

      - name: Typecheck, build and verify the artefact
        working-directory: themes/gallery
        run: |
          set -o pipefail
          pnpm run typecheck
          pnpm run build
          pnpm run check:dist
          pnpm run check:fonts

      - name: Publish to the generated gallery repository
        if: env.THEMES_PUSH_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.THEMES_PUSH_TOKEN }}
        run: bin/build/publish-themes.sh --yes

      - name: Publish skipped (no THEMES_PUSH_TOKEN)
        if: env.THEMES_PUSH_TOKEN == ''
        run: |
          echo "::notice::THEMES_PUSH_TOKEN is not set; the gallery was built and checked but not published."
