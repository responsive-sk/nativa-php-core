# =============================================================================
# Nativa PHP Core — CI
# =============================================================================
# The gates this tree actually has, run on a FRESH checkout — which is a
# KERNEL-ONLY tree: `src/Modules/*` is gitignored operator state, so a clone
# carries `Modules\Core` + `Modules\Database` and nothing else. That fact
# decides what each job may assert:
#
#   1. lint + PHPStan   — the code this repo owns (the same scope the two
#                         tool configs use).
#   2. Code style       — php-cs-fixer + Rector dry-runs. Both were
#                         non-gates before this workflow: neither config file
#                         existed in the slice, so `cs-fix-dry` CREATED a
#                         config and appended to .gitignore (a "dry run" that
#                         mutates the tree) and `rector-dry` printed "No
#                         rector.php config found" and exited 0.
#   3. PHPUnit          — the harness suite AND the committed catalogue's own
#                         tests (`modules/Blog/tests/`, a second PHPUnit
#                         suite). Measured on this workflow's first run: the
#                         kernel-only tree reports 18 tests / 32 assertions /
#                         5 skipped, the workstation (Blog installed) 18 / 45
#                         / 1. The split is not cosmetic — `tests/` is inside
#                         phpstan's scope and `modules/` is not, so a test that
#                         names an optional module's class cannot fail the
#                         analyser of a tree where that module is absent. That
#                         is exactly how run #1 went red here.
#   4. Modules          — the SAME suite with the catalogue INSTALLED. Job 3
#                         proves the kernel-only shape, and that shape SKIPS
#                         the guards the catalogue owns: measured on a fresh
#                         checkout, 243 of 318 tests skip, and the reset-token
#                         port, the comment honeypot, the password policy, the
#                         submit throttles, the admin access control and the
#                         rate limiter are all in that skipped set. (The CSRF
#                         origin check is not among them: `CsrfMiddlewareTest`
#                         lives in `tests/`, so job 3 already runs it.) A pull
#                         request could have deleted any of the others and this
#                         workflow stayed green — the one thing a gate may not
#                         do. This job installs the catalogue the way an
#                         operator does, migrates, picks a built theme, and
#                         fails on any test that did not run.
#   5. Admin flows      — the panel, BOOTED: a real server, a real session and
#                         a real CSRF token, a user and a role created and
#                         deleted through the panel, the CSRF refusals, and an
#                         author's refused bulk post with its security event
#                         read back out of the outbox. Job 4 proves the guards a
#                         class at a time; this proves the deployment, which is
#                         the only place a 500 in the panel shows up.
#   6. Assets           — the pnpm workspace is committed, so the bundles that
#                         /mark's stylesheet comes from are built HERE and the
#                         manifest the PHP reader probes is asserted, not
#                         assumed.
#   7. Boot             — the six kernel surfaces over real HTTP, a module
#                         installed → served → removed → 404, and `bin/cms
#                         migrate`. No `composer install` in this job,
#                         deliberately: the kernel runtime has zero Composer
#                         dependencies, and this is where that claim is either
#                         true or not.
#   8. Extract-check    — NOT run: `bin/build/extract-kernel.sh --check` needs
#                         a checkout of upstream, which is PRIVATE, and the
#                         run's GITHUB_TOKEN cannot read it. The job records
#                         that (with the measured evidence and how to enable
#                         it) instead of reporting a pass it did not earn.
# =============================================================================

name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PHP_VERSION: "8.5"

jobs:
  # ---------------------------------------------------------------------------
  # LINT + PHPSTAN — syntax and static analysis
  # ---------------------------------------------------------------------------
  analysis:
    name: Lint + PHPStan + Lekalo model
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: json, mbstring, pdo, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor/
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
            composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Every .php file the tree ships, `php -l` per file. The Makefile target
      # used to end in `|| true`, so it printed real parse errors and exited 0
      # — a gate that could not fail. It now lets the status through and keeps
      # only stderr, so this step is the one that fails on a broken file.
      - name: Lint every PHP file
        run: make lint

      - name: Run PHPStan
        run: composer phpstan

      # -------------------------------------------------------------------------
      # LEKALO MODEL — the architectural model under lekalo/
      #
      # WHAT THIS DOES NOT DO, and it matters more than what it does: with
      # `adapters 0` in lekalo.lock there is no PHP adapter, so nothing here
      # compares the model to the code. `validate` checks the model's own
      # consistency — refs resolve, ids are unique, the lock's digests match —
      # NOT that `users.password_min_length` still says what
      # `PasswordPolicy::MIN_LENGTH` says. The model is documentation with a
      # schema, and this gate keeps the documentation well-formed.
      #
      # That is still worth a job. The alternative is what this tree had for
      # weeks: a `lekalo/` directory that nothing ran, drifting silently while
      # every other layer had a gate. Seven of twenty-one modules are modelled
      # and the rest are stubs, which is the coverage question to ask next — not
      # this gate's.
      #
      # The model's *module set* is compared to the catalogue, but by a test in
      # the PHPUnit job rather than here: `ModelCatalogueContractTest` fails if a
      # slice outlives its module or a module has no slice. That test cannot
      # replace the adapter, and this job cannot replace that test — measured
      # 2026-10-16, `lock --check` stays at exit 0 when a slice is moved out of
      # `lekalo/` and drops out of the model.
      #
      # `make lekalo-check` runs the whole model AND every module on its own
      # (bin/build/lekalo-modules.sh), because `lekalo validate --module <id>`
      # scopes the REPORT and not the validation: a healthy module exits 1 while
      # another module is red, so the per-module answer here is attribution by
      # source path rather than twenty-one exit codes.
      #
      # `--strict` is deliberately NOT run, and the reason is not only the missing
      # adapter: measured 2026-10-16, strict is red on
      # `LEK-AUTH-009 authorization.effect-unprotected` — protected effects with no
      # authorization declaration. Turning it on is a coverage decision about the
      # model, not a switch waiting for an adapter to exist.
      # -------------------------------------------------------------------------

      - name: Install lekalo CLI (pinned v0.6.5, checksum-verified)
        run: |
          set -euo pipefail
          version=v0.6.5
          target=x86_64-unknown-linux-gnu
          archive="lekalo-${version}-${target}.tar.gz"
          # The tag is immutable and the checksum is the identity: a re-rolled
          # upstream asset fails here instead of silently changing what the gate
          # ran, and the job needs no Rust toolchain. Same version and checksum
          # as nativa-minimal's install step, so the two projects cannot drift
          # into validating against different binaries.
          curl -fsSL -o "/tmp/${archive}" \
            "https://github.com/ichinya/lekalo/releases/download/${version}/${archive}"
          echo "27cdb64ae99d7180530a05fbc722834c129e73faa693ddafc8c08b60e7794694  /tmp/${archive}" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar xzf "/tmp/${archive}" -C /tmp
          install -m 0755 "/tmp/lekalo-${version}-${target}/lekalo" "$HOME/.local/bin/lekalo"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lekalo gate (lock --check + validate)
        run: make lekalo-check

  # ---------------------------------------------------------------------------
  # CODE STYLE — php-cs-fixer + Rector dry-runs
  # ---------------------------------------------------------------------------
  code-style:
    name: Code style
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: json, mbstring, pdo, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor/
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
            composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check code style
        run: composer cs-fix-dry

      # Rector is pinned to the version the showcase resolves (2.6.1, see
      # composer.json) because 2.7.0 adds StringClassNameToClassConstantRector,
      # which rewrites code byte-identical to the upstream slice — a dev-tool
      # bump that would force four recorded divergences for no behavioural
      # gain. Both dry-runs must report nothing; the tools do not agree on
      # every formatting detail, so a change here is a change to ONE of them.
      - name: Run Rector dry-run
        run: composer rector-dry

  # ---------------------------------------------------------------------------
  # PHPUNIT — the test suite in the kernel-only shape
  # ---------------------------------------------------------------------------
  tests:
    name: PHPUnit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: json, mbstring, pdo, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor/
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
            composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # No pnpm, no build: nothing the kernel-only suite renders reads a bundle
      # (the kernel theme ships no CSS — see docs/kernel-status.md). The suite
      # asserts that `/mark` answers 404 here, which is the admin-is-a-module
      # contract, and skips the catalogue tests it cannot run (Blog's).
      - name: Run PHPUnit
        run: composer test

  # ---------------------------------------------------------------------------
  # MODULES — the same suite with the catalogue INSTALLED
  # ---------------------------------------------------------------------------
  # `tests` above proves the kernel-only shape, and that shape SKIPS the guards
  # the catalogue owns (see the header: on a fresh checkout 243 of 318 tests
  # skip). This job never skips one it can run:
  #
  #   - the catalogue is installed through `bin/cms module:add`, one refusal at
  #     a time — the refusal names the missing closure, so the retry IS the
  #     topological sort. That sort only terminates on an ACYCLIC closure graph:
  #     Boot 26 measured the loop stalling on `Cardboard → Security → Outbox →
  #     Cardboard`, and the two observability edges are now guarded (the
  #     catalogue installs in four rounds);
  #   - the migrators run, because a module test that reads a module database
  #     skips when the file is absent (Blog's AdminEscapeTest on locales.db);
  #   - the bundles are built, because `public/dist/*` is gitignored and
  #     ErikThemeTest skips when its manifest is not on disk;
  #   - and the run is ASSERTED, not eyeballed: every test file the catalogue
  #     ships must appear in the JUnit log, and the one test allowed to skip is
  #     the kernel-only contract that this install makes unreachable.
  modules:
    name: Modules (catalogue installed)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: json, mbstring, pdo, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor/
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
            composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: Frontend/packages/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: Frontend/packages

      # Built here rather than tolerated as a skip: `public/dist/` is gitignored
      # (except the frozen griffe and mono manifests), and a module test that
      # guards on the file — never on `AssetManager::isAvailable()`, which is
      # what the defect breaks — skips without it.
      - name: Build every theme bundle
        run: pnpm build
        working-directory: Frontend/packages

      # The loop lives in bin/build/install-catalogue.sh, not here: the
      # `admin-smoke` job below needs the same installed tree, and two copies of
      # a topological sort is one copy too many. `make modules-install` runs the
      # same script, so a red job is reproducible in one command.
      - name: Install every catalogue module
        run: bin/build/install-catalogue.sh

      # The same idempotent run the HTTP bootstrap does on its first request,
      # forced. A module test that reads a module database skips when the file is
      # missing, and a skip is exactly what this job exists to remove.
      - name: Run the migrators the module tests read
        run: |
          set -euo pipefail
          php bin/cms migrate | tee /tmp/migrate.log
          grep -q 'Migrated:' /tmp/migrate.log || { echo "::error::no migrators ran in a tree with the catalogue installed"; exit 1; }
          for db in audit blog comments config locales media outbox questions users; do
            test -f "storage/data/$db.db" || { echo "::error::storage/data/$db.db was not created"; exit 1; }
          done
          echo "ok  the module databases exist"

      # The suite renders the homepage with the ACTIVE theme and asserts that
      # theme's own build is inlined — and the migrators seed `theme=kernel`,
      # whose bundle does not exist by design (the kernel theme is hand-written
      # critical CSS). Measured on a fresh checkout without this step: 2 tests
      # skip, and the assertion below fails on
      # `ErikThemeTest::liveSurfacesInlineTheActiveThemesOwnBuild` — a skip that
      # is the SEED talking, not a defect. An operator picks a theme in
      # `/mark` → Design; this is that pick, through the module's own
      # repository, so the test has a build to inline. A stored name nothing
      # can render would resolve back to the kernel theme and the assertion
      # would fail loudly — which is the point.
      - name: Pick the theme the suite renders with (the operator's Design pick)
        run: |
          set -euo pipefail
          php <<'PHP'
          <?php
          require 'src/init.php';
          $pdo = \Modules\Database\Infrastructure\Persistence\DatabaseConnectionManager::instance()->connection('config');
          (new \Modules\Settings\Infrastructure\Persistence\Repositories\SettingsRepository($pdo))->set('theme', 'mono', 'design');
          PHP
          php <<'PHP'
          <?php
          require 'src/init.php';
          $theme = \Modules\Core\Interfaces\HTTP\ThemeKernel::for(\Modules\Core\Interfaces\HTTP\ThemeResolver::resolvePath('/'));
          $assets = new \Modules\Core\Application\Services\AssetManager($theme->name());
          printf("active theme: %s (bundle available: %s)\n", $theme->name(), $assets->isAvailable() ? 'yes' : 'no');

          if (!$assets->isAvailable()) {
              exit(1);
          }
          PHP

      - name: Run the full suite (kernel + catalogue)
        run: composer test -- --log-junit /tmp/modules-junit.xml

      # The assertion this job exists for. "OK, but some tests were skipped" is
      # how a deleted guard looks from here, so the JUnit log is read instead of
      # the summary: every `modules/<Name>/tests/<Class>Test.php` the catalogue
      # ships must have run, and the only testcase allowed to be skipped is
      # KernelOnlyBootTest::unroutedAdminPathIsNeverForbidden — its subject is
      # the kernel-only tree, and Cardboard is installed here, so its own reason
      # string says why. (Every other skip was removed rather than listed: the
      # modules are installed, the migrators ran, the bundles are built and the
      # theme above is a built one.)
      - name: Assert the suite ran instead of skipping
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, os, sys, xml.etree.ElementTree as ET

          ALLOWED_SKIPS = {('Tests.Boot.KernelOnlyBootTest', 'unroutedAdminPathIsNeverForbidden')}

          cases = list(ET.parse('/tmp/modules-junit.xml').iter('testcase'))
          ran = {c.get('classname') for c in cases}
          skipped = {(c.get('classname'), c.get('name')) for c in cases
                     if any(child.tag == 'skipped' for child in c)}

          expected = set()
          for path in glob.glob('modules/*/tests/*Test.php'):
              _, name, _, file = path.split(os.sep)
              expected.add('Modules.%s.Tests.%s' % (name, file[:-len('.php')]))

          print('%d tests ran, %d skipped, %d catalogue test classes expected'
                % (len(cases), len(skipped), len(expected)))

          failed = False
          for cls in sorted(expected - ran):
              print('::error::%s never ran — the catalogue is installed, so it has no reason to skip' % cls)
              failed = True
          for cls, name in sorted(skipped - ALLOWED_SKIPS):
              print('::error::%s::%s skipped in a tree with the catalogue installed' % (cls, name))
              failed = True
          for cls, name in sorted(ALLOWED_SKIPS - skipped):
              print('note: %s::%s no longer skips — remove it from ALLOWED_SKIPS' % (cls, name))
          sys.exit(1 if failed else 0)
          PY

  # ---------------------------------------------------------------------------
  # ADMIN-SMOKE — the panel, booted, with a real session and a real token
  # ---------------------------------------------------------------------------
  # The suite above proves the guards a class at a time. This job boots the
  # server the way a deployment does and walks the flows an operator walks:
  # guest surfaces, admin login, a user created and deleted, a role created and
  # deleted, the CSRF refusals, an author's REFUSED bulk post with the security
  # event read back out of the outbox, the article and page editors (asserted on
  # the FILE, not the status), the public comment form (honeypot, pending,
  # moderation, publication) and both queues — the outbox drain that delivers the
  # events the run records, and the Queue worker over a job nobody can route,
  # retried and dropped through the panel. Boot 27 measured that matrix by hand;
  # `bin/build/admin-smoke.sh` makes it enforceable — a change that 500s the
  # panel or silently drops a security event now fails a job.
  #
  # No `composer install` here, deliberately, for the same reason the `boot` job
  # skips it: the kernel runtime has zero Composer dependencies and the modules
  # are installed from the committed catalogue. Every DB_* points at a temp
  # directory inside the script, and the server starts and stops there, so the
  # job never writes to the checkout's storage/data/.
  #
  # CONTENT is the one thing it writes into the checkout — an article and a page
  # have no root override the way the databases do — so the script snapshots
  # `storage/` and FAILS if it does not come back exactly as it found it. On a
  # runner the checkout is disposable; the assertion is what makes the same
  # script safe to run on a workstation.
  #
  # What it does NOT do: the refusals that need a forged client address. Loopback
  # is exempt from throttling by design and a `php -S` probe cannot set
  # REMOTE_ADDR, so the register/reset throttles and the rate-limit 429 stay
  # pinned by unit tests under the `modules` job.
  admin-smoke:
    name: Admin flows (booted server)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: json, mbstring, pdo, pdo_sqlite, sqlite3
          coverage: none

      - name: Install every catalogue module
        run: bin/build/install-catalogue.sh

      # The script migrates, seeds its own accounts through the modules'
      # repositories, starts `php -S` with opcache off, runs the matrix, asserts
      # the outbox rows, and stops the server — one entry point, so a red job is
      # `make admin-smoke` on a workstation.
      - name: The admin flows over HTTP
        run: bin/build/admin-smoke.sh

  # ---------------------------------------------------------------------------
  # ASSETS — the committed pnpm workspace builds here
  # ---------------------------------------------------------------------------
  assets:
    name: Assets (pnpm)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: Frontend/packages/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: Frontend/packages

      - name: Build every theme bundle
        run: pnpm build
        working-directory: Frontend/packages

      # The build output is gitignored, so nothing below can pass by finding a
      # committed artifact. `mark`, `mark-switch` and `moonshine` are the entries
      # `AdminLayout::markCssLinks()` resolves out of this manifest for /mark;
      # the names are load-bearing and a rename breaks the admin chrome
      # silently (a page with no stylesheet still answers 200).
      #
      # Matched on the entries' `name` field, NOT on the manifest's top-level
      # keys: Vite keys the manifest by RESOLVED SOURCE PATH
      # (`src/mark/index.css`), a detail this step got wrong on its first run
      # and a control (`any(... "nope")`) caught — a `has("mark")` assertion
      # would have been red on every push, for the wrong reason.
      - name: Assert the admin manifest still carries its entries
        run: |
          set -euo pipefail
          manifest=public/dist/moonshine/manifest.json
          jq -e 'any(.[]; .name == "mark")
                 and any(.[]; .name == "mark-switch")
                 and any(.[]; .name == "moonshine")' "$manifest"
          mark_css="public/dist/moonshine/$(jq -r '.[] | select(.name == "mark") | .file' "$manifest")"
          test -f "$mark_css"
          echo "ok  the manifest names its three entries and $mark_css exists"
          ls -l public/dist/moonshine/assets/

      # The griffe bundle is the freeze exception: its dist IS committed (see
      # the .gitignore negation), so this step asserts the committed manifest
      # still carries the entry the layout inlines and defers — a renamed
      # entry renders griffe pages with the critical fallback and no script.
      - name: Assert the frozen griffe manifest still carries its entry
        run: |
          set -euo pipefail
          manifest=public/dist/griffe/manifest.json
          jq -e 'any(.[]; .name == "griffe")' "$manifest"
          js="public/dist/griffe/$(jq -r '.[] | select(.name == "griffe") | .file' "$manifest")"
          css="public/dist/griffe/$(jq -r '.[] | select(.name == "griffe") | .css[0]' "$manifest")"
          test -f "$js"
          test -f "$css"
          echo "ok  the manifest names griffe and $js + $css exist"
          ls -l public/dist/griffe/assets/

      # The mono bundle is the second freeze exception: same contract as
      # griffe above, guarded by MonoBuildFreezeTest.
      - name: Assert the frozen mono manifest still carries its entry
        run: |
          set -euo pipefail
          manifest=public/dist/mono/manifest.json
          jq -e 'any(.[]; .name == "mono")' "$manifest"
          js="public/dist/mono/$(jq -r '.[] | select(.name == "mono") | .file' "$manifest")"
          css="public/dist/mono/$(jq -r '.[] | select(.name == "mono") | .css[0]' "$manifest")"
          test -f "$js"
          test -f "$css"
          echo "ok  the manifest names mono and $js + $css exist"
          ls -l public/dist/mono/assets/

      # Chrome 70 (< 99) drops @layer blocks entirely, which is why the build
      # strips them (build/strip-at-layer.ts). A reintroduced one parses,
      # matches nothing, and unstyled is indistinguishable from a design.
      - name: Assert no @layer survived the build
        run: |
          set -euo pipefail
          if grep -l '@layer' public/dist/*/assets/*.css; then
            echo "::error::@layer found in a built stylesheet — Chrome 70 drops the whole block."
            exit 1
          fi
          echo "no @layer in any built stylesheet"

  # ---------------------------------------------------------------------------
  # BOOT — the kernel-only tree over real HTTP, with no vendor/
  # ---------------------------------------------------------------------------
  boot:
    name: Boot (kernel-only, no vendor)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: json, mbstring, pdo, pdo_sqlite, sqlite3
          coverage: none

      # NO `composer install` on purpose. The kernel runtime has zero Composer
      # dependencies and `src/init.php` installs a PSR-4 fallback loader for the
      # tree that has no vendor/ — that is the claim, and a job that installs
      # first would never test it.
      #
      # This job is what found the claim false (Boot 19): Router discovery
      # class_exists()'d every file under the action dirs, so a route-less
      # command extending symfony/console's Command — a DEV dependency — made
      # `/` answer 500 in a vendor-less checkout. It was the kernel's own
      # ServeCommand then; those are deleted as dead code, and module-level
      # commands (modules/Blog's GenerateImagesCommand, modules/Outbox's
      # ProcessOutboxCommand) are the live reason the guard must stay. The fix
      # is upstream's mayDeclareRoute() text guard, adopted in
      # src/Modules/Core/Interfaces/HTTP/Router.php; without it every step below
      # fails on a 500.
      - name: Prove there is no vendor directory
        run: |
          set -euo pipefail
          test ! -d vendor || { echo "::error::vendor/ exists in this job — the check is meaningless"; exit 1; }
          echo "no vendor/ in the tree"

      # bin/cms is plain PHP by design (what manages modules must run where
      # vendor/ may not exist). In a kernel-only tree there are no migrators:
      # that message is the documented state, so assert it instead of assuming
      # a silent no-op.
      - name: Migrate a kernel-only tree
        run: |
          set -euo pipefail
          php bin/cms migrate | tee /tmp/migrate.log
          grep -q "No migrators found" /tmp/migrate.log

      # Measured in a kernel-only checkout: `Installed (1): KernelTheme`. The
      # kernel's own theme is the one committed slice under src/Modules/ — it
      # IS part of the kernel (the default presentation), not operator state,
      # so it ships with the tree. Core and Database are filtered out of the
      # count as KERNEL_MODULES. The catalogue is the other half and IS
      # present: the feature modules are committed as a catalogue (modules/),
      # their installed slices are not.
      - name: Module catalogue is visible
        run: |
          set -euo pipefail
          php bin/cms module:list | tee /tmp/modules.log
          grep -q "Installed (1): KernelTheme" /tmp/modules.log
          grep -q "Scratch" /tmp/modules.log

      # opcache is ON for the CLI SAPI on the runner image and its default
      # revalidate window is minutes, so a long-lived `php -S` can serve code
      # that no longer exists — measured on a workstation dev server in Boot 18,
      # where a fix looked like a no-op until the server was restarted. The
      # server below also has to observe a module being ADDED and REMOVED, so
      # it runs with the cache off.
      - name: Start the dev server
        run: |
          set -euo pipefail
          php -d opcache.enable_cli=0 -S 127.0.0.1:8000 -t public > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/ 2>/dev/null; then
              echo "server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server never came up:"
          cat /tmp/server.log
          exit 1

      # `check <path> <status>`; a page cache or an error page would change the
      # code, so the status IS the assertion.
      - name: The six kernel surfaces answer over HTTP
        run: |
          set -euo pipefail
          check() {
            local got
            got="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8000$1")"
            if [ "$got" != "$2" ]; then
              echo "::error::GET $1 expected $2, got $got"
              return 1
            fi
            echo "ok  $1 → $got"
          }
          check /            200
          check /sitemap.xml 200
          check /robots.txt  200
          check /docs        200
          check /nope        404
          # The interesting one: not 403 and not 500. The admin is a module, and
          # a path the kernel has no route for is NOT FOUND — never Forbidden.
          check /mark        404

      # Task 4.1's live proof: install a module, serve its route, remove it,
      # and watch the route disappear — through HTTP, not through the service.
      - name: A module installs, serves and uninstalls
        run: |
          set -euo pipefail
          php bin/cms module:add Scratch
          before="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/scratch)"
          [ "$before" = "200" ] || { echo "::error::/scratch after add expected 200, got $before"; exit 1; }
          echo "ok  /scratch → 200 after module:add"
          php bin/cms module:remove Scratch
          after="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/scratch)"
          [ "$after" = "404" ] || { echo "::error::/scratch after remove expected 404, got $after"; exit 1; }
          echo "ok  /scratch → 404 after module:remove"

      - name: No fatal errors were logged
        run: |
          set -euo pipefail
          if grep -qE "PHP Fatal error|\[KERNEL\] Error" storage/logs/php-error.log; then
            cat storage/logs/php-error.log
            echo "::error::the boot wrote a fatal error to storage/logs/php-error.log"
            exit 1
          fi
          echo "error log is clean"

      - name: Show the server log
        if: always()
        run: tail -50 /tmp/server.log || true

  # ---------------------------------------------------------------------------
  # EXTRACT-CHECK — not run here, and the reason is measured, not assumed
  # ---------------------------------------------------------------------------
  # This job was briefly a real gate: a cross-repository `actions/checkout` of
  # `evan70/nativa-minimal` plus `extract-kernel.sh --check --minimal-root
  # .upstream/nativa-minimal`. It failed inside the action, at
  # `Determining the default branch`:
  #
  #     Error: Not Found - https://docs.github.com/rest/repos/repos#get-a-repository
  #
  # THE UPSTREAM REPOSITORY IS PRIVATE. The run's GITHUB_TOKEN is scoped to
  # THIS repository, so `GET /repos/evan70/nativa-minimal` answers 404 — for a
  # private repo it answers 404 even to a token that exists.
  #
  # The first version of this job concluded the opposite from a workstation
  # measurement, and the way it was wrong is worth keeping: an "anonymous"
  # `git ls-remote https://github.com/evan70/nativa-minimal` SUCCEEDS locally —
  # because this machine's git config carries `credential.helper = store`, so
  # the call was authenticated by a stored token and reported nothing about
  # publicness. With the helpers disabled it is unambiguous:
  #
  #     GIT_CONFIG_GLOBAL=/dev/null GIT_ASKPASS=/bin/true git ls-remote …
  #     remote: Repository not found.
  #     fatal: Authentication failed for 'https://github.com/evan70/nativa-minimal/'
  #
  # and the API agrees: `GET /repos/evan70/nativa-minimal` is 404 without a
  # token, 200 with the owner's, which reports `"private": true`.
  #
  # So the linkage is deleted rather than propped up with a secret. The guard
  # itself is unchanged and runs where upstream IS a checkout — a workstation:
  # `make extract-check`. What it needs to return here is a credential the
  # runner has none of: a fine-grained PAT with `contents: read` on the private
  # upstream, stored as the `UPSTREAM_TOKEN` secret, then `actions/checkout`
  # with `repository: evan70/nativa-minimal` and that token, and the guard
  # pointed at wherever the checkout lands with `--minimal-root` (a path INSIDE
  # the workspace: the action throws on any `path` that escapes it —
  # `Repository path '…' is not under '…'`, src/input-helper.ts).
  #
  # Recorded as not-run, not as a pass. A gate that cannot run must say so.
  extract-check:
    name: Extract-check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Extract-check needs a credential this runner does not have
        run: |
          echo "NOT RUN: bin/build/extract-kernel.sh --check diffs this tree against evan70/nativa-minimal."
          echo "That repository is PRIVATE and this run's GITHUB_TOKEN is scoped to this one, so a"
          echo "cross-repository checkout fails with: Not Found (GET /repos/evan70/nativa-minimal)."
          echo
          echo "Run it where upstream is a sibling checkout:  make extract-check"
          echo "To run it here: add a fine-grained PAT (contents: read on the private repo) as the"
          echo "UPSTREAM_TOKEN secret and check the upstream out with it, then pass the checkout"
          echo "path to the guard as --minimal-root."

