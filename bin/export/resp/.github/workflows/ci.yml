# GENERATED into the nativa-resp repository by bin/build/export-core.sh. This
# file is the client tree's own gate list, not a filtered copy of the source
# workflow: the jobs that need a sibling checkout or the source tree's
# architectural model do not exist here.
#
# Every `make` target below is a target of the exported Makefile. The exporter
# asserts that in both directions, so a job cannot call a recipe that is not
# shipped.
# =============================================================================

name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PHP_VERSION: "8.5"

jobs:
  analysis:
    name: Lint + PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: json, mbstring, pdo, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor/
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
            composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint every PHP file
        run: make lint

      - name: Run PHPStan
        run: composer phpstan

  kernel-dependency:
    name: Kernel dependency (mago guard)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache mago
        uses: actions/cache@v5
        with:
          path: storage/cache/mago-spike
          key: mago-1.60.2-x86_64-unknown-linux-gnu

      - name: Guard gate
        run: make mago-guard

  curated-lint:
    name: Curated lint count (mago lint)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache mago
        uses: actions/cache@v5
        with:
          path: storage/cache/mago-spike
          key: mago-1.60.2-x86_64-unknown-linux-gnu

      - name: Lint gate
        run: make mago-lint

  tests:
    name: PHPUnit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: json, mbstring, pdo, pdo_sqlite, sqlite3, gd
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor/
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
            composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run the suite (make test migrates first)
        run: make test

  assets:
    name: Assets (pnpm)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: Frontend/packages/pnpm-lock.yaml

      - name: Build the Boson bundle
        run: make assets

  dist:
    name: Dist artifact (clean clone)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: json, mbstring, pdo, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none

      - name: Build and smoke the artifact from a clean clone
        run: make dist-check

  security-audit:
    name: Security audit (tracked tree)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Audit the tracked tree
        run: make security-audit

  dependency-audit:
    name: Dependency audit (composer + pnpm)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 12

      - name: Audit both lockfiles
        run: make dependency-audit
